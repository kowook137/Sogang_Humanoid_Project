name: Fall detection tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fall_detection/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r fall_detection/requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q fall_detection exaone_finetuning
      - name: Run unit tests
        run: python -m unittest discover -s fall_detection/tests -v
